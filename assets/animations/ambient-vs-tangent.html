    display: inline-flex; align-items: center; gap: 5px; position: absolute;

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const CHANNEL = 'patacon-steering-animation';
  const EMBED = document.documentElement.classList.contains('embed');
  const PARENTED = EMBED && window.parent !== window;
  const viewer = $('viewer');
  const diagram = $('diagram');
  const timeline = $('timeline');
  const duration = 9.7;

  function svg(tag, attrs, parent) {
    const el = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, String(value));
    if (parent) parent.appendChild(el);
    return el;
  }
  const clamp = (x, lo=0, hi=1) => Math.max(lo, Math.min(hi, x));
  const ramp = (time, from, to) => clamp((time - from) / (to - from));
  const smooth = x => x*x*(3-2*x);
  const opacity = (el, amount) => el.setAttribute('opacity', amount.toFixed(4));
  const lerp = (a, b, u) => [a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u];
  const xy = p => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`;

  // A static orthographic spherical-patch mesh: pure SVG, no textures,
  // raster frames, video, external fonts, CDNs, or WebGL dependencies.
  function buildManifold() {
    const R = 2.3, radius = 1.65, root2 = Math.sqrt(2);
    const project = (u,v) => [
      95*(u-v)/root2,
      16*(u+v)/root2 + 183*(R-Math.sqrt(Math.max(0, R*R-u*u-v*v)))
    ];
    const cloud = [];
    for (let j=0; j<=55; j++) {
      const r = radius*j/55;
      for (let i=0; i<200; i++) {
        const a = i*Math.PI*2/200;
        cloud.push(project(r*Math.cos(a), r*Math.sin(a)));
      }
    }
    // Convex hull gives the silhouette of the projected spherical patch.
    const sorted = cloud.sort((a,b) => a[0]-b[0] || a[1]-b[1]);
    const cross = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
    const lower=[], upper=[];
    for (const p of sorted) {
      while (lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop();
      lower.push(p);
    }
    for (let i=sorted.length-1; i>=0; i--) {
      const p=sorted[i];
      while (upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop();
      upper.push(p);
    }
    const outline=lower.slice(0,-1).concat(upper.slice(0,-1));
    const group=$('manifold-surface');
    svg('path', {d:'M'+outline.map(xy).join('L')+'Z',fill:'url(#surface-fill)'},group);
    const grid=svg('g',{fill:'none',stroke:'#6099c0','stroke-width':'.48','stroke-opacity':'.35',mask:'url(#grid-mask)'},group);
    for (let axis=0; axis<2; axis++) {
      for (let i=1; i<43; i++) {
        const a=-radius+2*radius*i/43;
        const span=Math.sqrt(radius*radius-a*a), points=[];
        for (let j=0; j<=90; j++) {
          const b=-span+2*span*j/90;
          points.push(axis===0 ? project(a,b) : project(b,a));
        }
        svg('path',{d:'M'+points.map(xy).join('L')},grid);
      }
    }
  }
  buildManifold();

  // These are diagram coordinates reconstructed from the supplied clip.
  // They illustrate projection; they are not a live IK/Newton solver.
  const ambient = {
    origin:[237,210],
    samples:[[265.8,181.6],[294.6,153.2],[323.4,124.8],[352.2,96.4]],
    targets:[[262,211],[278,216],[293,223],[306,229]],
    projectionStart:1.20, projectionDuration:.67, stagger:.075,
    sampleStart:0, color:'#d76a38', marker:'arrow-orange', group:$('ambient-projection')
  };
  const tangent = {
    origin:[709,207],
    samples:[[746,207],[782,207],[815,207]],
    targets:[[746,224],[782,241],[815,260]],
    projectionStart:5.65, projectionDuration:.55, stagger:.10,
    sampleStart:4.55, color:'#94268b', marker:'arrow-purple', group:$('tangent-projection')
  };
  function prepare(system) {
    system.edgeLayer=svg('g',{fill:'none',stroke:'#142432','stroke-width':'1.85','stroke-linecap':'round','stroke-linejoin':'round'},system.group);
    system.arrowLayer=svg('g',{fill:'none',stroke:system.color,'stroke-width':'1.35','stroke-linecap':'round'},system.group);
    system.nodeLayer=svg('g',{},system.group);
    system.items=system.samples.map((source,i) => {
      const arrow=svg('path',{'marker-end':`url(#${system.marker})`,opacity:0},system.arrowLayer);
      const edge=svg('path',{opacity:0},system.edgeLayer);
      const node=svg('circle',{cx:source[0],cy:source[1],r:4.2,fill:'#ffede3',stroke:'#1b242a','stroke-width':'1.05'},system.nodeLayer);
      return {arrow,edge,node,source,target:system.targets[i]};
    });
  }
  prepare(ambient); prepare(tangent);

  // Short progress ticks reproduce the shrinking ambient-space steps.
  const ticks=svg('g',{stroke:'#142432','stroke-width':'1.3',fill:'none',opacity:0},ambient.group);
  [[242,260,228,213],[267,278,240,219],[284,293,249,226],[299,306,256,233]].forEach(([a,b,y,top]) => {
    const x=(a+b)/2;
    svg('path',{d:`M${x} ${top}V${y-4}`,'marker-end':'url(#arrow-black)'},ticks);
    svg('path',{d:`M${a} ${y-4}V${y+4}M${a} ${y}H${b}M${b} ${y-4}V${y+4}`},ticks);
  });

  function renderSystem(system,time) {
    const done=[];
    system.items.forEach((item,i) => {
      const show=system===ambient ? 1 : smooth(ramp(time,system.sampleStart+i*.09,system.sampleStart+.26+i*.09));
      const progress=smooth(ramp(time,system.projectionStart+i*system.stagger,system.projectionStart+i*system.stagger+system.projectionDuration));
      done.push(progress);
      const point=lerp(item.source,item.target,progress);
      item.node.setAttribute('cx',point[0].toFixed(3));
      item.node.setAttribute('cy',point[1].toFixed(3));
      // The sampled node itself moves to the manifold and turns gray.
      const start=system===ambient ? [255,237,227] : [234,252,231];
      const end=[147,156,162];
      item.node.setAttribute('fill',`rgb(${start.map((v,k)=>Math.round(v+(end[k]-v)*progress)).join(',')})`);
      opacity(item.node,show);
      const length=Math.hypot(point[0]-item.source[0],point[1]-item.source[1]);
      const arrowEnd=length>5.8 ? lerp(item.source,point,(length-5.8)/length) : item.source;
      item.arrow.setAttribute('d',`M${xy(item.source)}L${xy(arrowEnd)}`);
      opacity(item.arrow,length>6.0 ? show : 0);
      // Only connect projected endpoints after both have landed.
      const previous=i===0 ? system.origin : system.targets[i-1];
      const connect=smooth(ramp(time,system.projectionStart+i*system.stagger+system.projectionDuration-.07,system.projectionStart+i*system.stagger+system.projectionDuration+.11));
      item.edge.setAttribute('d',`M${xy(previous)}L${xy(lerp(previous,item.target,connect))}`);
      opacity(item.edge,connect);
    });
  }
  const leftLegend=$('ambient-legend'), rightLegend=$('tangent-legend');
  const leftCaption=$('ambient-caption'), rightCaption=$('tangent-caption');
  const leftBracket=$('ambient-bracket'), rightBracket=$('tangent-bracket');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  let time=reduced.matches ? 8.5 : 0;
  let playing=!reduced.matches;
  let speed=1, visible=true, expanded=false, animationId=0, previous=0;

  function render() {
    renderSystem(ambient,time); renderSystem(tangent,time);
    opacity(leftLegend,1-smooth(ramp(time,1.42,1.80)));
    opacity(rightLegend,1-smooth(ramp(time,5.46,5.84)));
    opacity(leftBracket,smooth(ramp(time,1.86,2.20)));
    opacity(rightBracket,smooth(ramp(time,6.19,6.58)));
    opacity(ticks,smooth(ramp(time,1.90,2.23)));
    opacity(leftCaption,smooth(ramp(time,3.04,3.44)));
    opacity(rightCaption,smooth(ramp(time,7.60,8.06)));
    timeline.value=time.toFixed(2);
    timeline.setAttribute('aria-valuetext',`${time.toFixed(1)} of ${duration} seconds`);
    $('time').textContent=`0:${time.toFixed(1).padStart(4,'0')} / 0:09.7`;
    diagram.dataset.time=time.toFixed(3);
  }
  function canRun() { return playing && visible && !document.hidden; }
  function frame(now) {
    animationId=0;
    if (!canRun()) { previous=0; return; }
    if (previous) time=(time+Math.min(.12,(now-previous)/1000)*speed)%duration;
    previous=now; render(); animationId=requestAnimationFrame(frame);
  }
  function schedule() {
    previous=0;
    if (animationId) cancelAnimationFrame(animationId);
    animationId=canRun() ? requestAnimationFrame(frame) : 0;
  }
  const PLAY='<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 3.5v13l11-6.5z"/></svg>';
  const PAUSE='<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="3.5" width="3.5" height="13" rx=".5"/><rect x="11.5" y="3.5" width="3.5" height="13" rx=".5"/></svg>';
  function syncButtons() {
    document.querySelectorAll('.play-icon').forEach(el=>el.innerHTML=playing ? PAUSE : PLAY);
    document.querySelectorAll('.play-label').forEach(el=>el.textContent=playing ? 'Pause' : 'Play');
    document.querySelectorAll('.play-toggle').forEach(el=>el.setAttribute('aria-label',playing ? 'Pause animation' : 'Play animation'));
    document.querySelectorAll('.expand-label').forEach(el=>el.textContent=expanded ? 'Close' : 'Enlarge');
    document.querySelectorAll('.expand-toggle').forEach(el=>el.setAttribute('aria-label',expanded ? 'Close enlarged animation' : 'Enlarge animation'));
  }
  function play() { playing=true; syncButtons(); schedule(); }
  function pause() { playing=false; syncButtons(); schedule(); }
  function togglePlay() { playing ? pause() : play(); }
  function replay() { time=0; render(); play(); }
  function seek(value, pauseAfter=false) {
    const n=Number(value); if (!Number.isFinite(n)) return;
    time=clamp(n,0,duration-.001); previous=0;
    if (pauseAfter) pause(); render();
  }
  function setSpeed(value) {
    const n=Number(value); if (!Number.isFinite(n) || n<=0) return;
    speed=clamp(n,.1,4); previous=0;
    const select=$('speed');
    if ([...select.options].some(o=>Number(o.value)===speed)) select.value=String(speed);
  }
  // file:// can expose either 'null' or 'file://' as its origin.
  const localOrigin = location.protocol === 'file:' || location.origin === 'null';
  const parentOrigin = localOrigin ? '*' : location.origin;
  function post(type,extra={}) { if(PARENTED) window.parent.postMessage({channel:CHANNEL,type,...extra},parentOrigin); }
  function setExpanded(value) {
    expanded=Boolean(value); document.documentElement.classList.toggle('expanded',expanded); syncButtons();
    if (expanded) document.querySelector('.controls .play-toggle').focus({preventScroll:true});
  }
  async function toggleExpand() {
    if (PARENTED) { post('toggle-expand'); return; }
    if (document.fullscreenElement) { await document.exitFullscreen().catch(()=>{}); return; }
    if (viewer.classList.contains('local-expanded')) { viewer.classList.remove('local-expanded'); setExpanded(false); return; }
    try {
      if (!viewer.requestFullscreen) throw new Error('Fullscreen unavailable');
      await viewer.requestFullscreen();
    } catch (_) {
      // A full-window fallback works even when the Fullscreen API is unavailable.
      viewer.classList.add('local-expanded'); setExpanded(true);
    }
  }
  document.querySelectorAll('.play-toggle').forEach(el=>el.addEventListener('click',togglePlay));
  document.querySelectorAll('.replay').forEach(el=>el.addEventListener('click',replay));
  document.querySelectorAll('.expand-toggle').forEach(el=>el.addEventListener('click',toggleExpand));
  timeline.addEventListener('input',()=>seek(timeline.value));
  $('speed').addEventListener('change',event=>setSpeed(event.target.value));
  diagram.addEventListener('click',()=>{ if (EMBED && !expanded) toggleExpand(); });
  document.addEventListener('fullscreenchange',()=>setExpanded(Boolean(document.fullscreenElement)));
  document.addEventListener('visibilitychange',schedule);
  document.addEventListener('keydown',event=>{
    if (expanded && event.key==='Tab') {
      const controls=[...document.querySelectorAll('.controls button,.controls input,.controls select')];
      const first=controls[0], last=controls[controls.length-1];
      if (event.shiftKey && document.activeElement===first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement===last) { event.preventDefault(); first.focus(); }
      return;
    }
    if (event.key==='Escape' && expanded && PARENTED) { event.preventDefault(); post('close-expand'); return; }
    if (event.key==='Escape' && viewer.classList.contains('local-expanded')) { viewer.classList.remove('local-expanded'); setExpanded(false); return; }
    if (event.target.closest('input,select,button,a,textarea') || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.code==='Space') { event.preventDefault(); togglePlay(); }
    else if (event.key.toLowerCase()==='r') replay();
    else if (event.key.toLowerCase()==='f') toggleExpand();
    else if (event.key==='ArrowLeft') { event.preventDefault(); seek(time-.5); }
    else if (event.key==='ArrowRight') { event.preventDefault(); seek(time+.5); }
  });
  window.addEventListener('message',event=>{
    if (!PARENTED || event.source!==window.parent) return;
    if (!localOrigin && event.origin !== location.origin) return;
    const m=event.data;
    if (!m || m.channel!==CHANNEL) return;
    if (m.type==='visibility') { visible=Boolean(m.visible); schedule(); }
    else if (m.type==='expanded') { setExpanded(m.expanded); if (expanded) { visible=true; schedule(); } }
    else if (m.type==='restart') replay();
    else if (m.type==='seek') seek(m.time,true);
  });
  // Readable control API for embedding, tests, or later timing changes. Seconds, not frames.
  window.PATACON_STEERING=Object.freeze({
    play,pause,replay,seek,setSpeed,duration,
    get state() { return {time,playing,speed,visible,expanded}; }
  });
  syncButtons(); render(); schedule(); post('ready');
})();
</script>
</body>
</html>
