function buildDome(){

 stepLabel.textContent=t<5.85?'Step 1: Candidate node generation':t<7.45?'Step 2: Simultaneous node projection':'Step 3: Multi-edge projection and validation';
 op(anchorLabel,phase(t,6.3,6.6)*(1-phase(t,7.45,7.75)));
 const failedCase=t>=14.2;
 paintDome(before,{project:1,edges:1,obstacle:failedCase,invalid:failedCase});
 paintDome(after,{project:1,edges:1,result:true,prefix:failedCase?2:4,obstacle:failedCase});
 op(after.g,phase(t,failedCase?14.65:11.86,failedCase?15.25:12.4));
 registrationCaption.textContent=failedCase?'[Invalid edge] Insert only the longest valid prefix':'[All edges valid] Insert the full batch into the tree';op(invalidCaption,failedCase?1:0);
 paintDome(leftResult,{result:true,prefix:4});paintDome(rightResult,{result:true,prefix:2,obstacle:true});
 show(finalLeft,t,17.15,.4);show(finalRight,t,20.15,.45);show(finalBanner,t,22.3,.45);
}

// Deterministic, seekable SVG timeline. No video, frame-sequence, or network dependency.
const duration=CONFIG.duration,channel='patacon-diagram-animation';
const embedded=new URLSearchParams(location.search).get('embed')==='1';
const parented=embedded&&window.parent!==window;
const parentOrigin=(location.protocol==='file:'||location.origin==='null')?'*':location.origin;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let time=reduced.matches?duration-.45:0,playing=!reduced.matches,speed=1,visible=true,expanded=false,raf=0,previous=0;
const viewer=$('viewer'),slider=$('timeline');slider.max=duration;
if(embedded)document.documentElement.classList.add('embed');
function timeLabel(n){return Math.floor(n/60)+':'+(n%60).toFixed(1).padStart(4,'0');}
function render(){renderScene(time);root.dataset.time=time.toFixed(3);slider.value=time.toFixed(3);slider.setAttribute('aria-valuetext',`${time.toFixed(1)} of ${duration.toFixed(1)} seconds`);$('time').textContent=timeLabel(time)+' / '+timeLabel(duration);}
function canRun(){return playing&&visible&&!document.hidden;}
function tick(now){raf=0;if(!canRun()){previous=0;return;}if(previous)time=(time+Math.min(.12,(now-previous)/1000)*speed)%duration;previous=now;render();raf=requestAnimationFrame(tick);}
function schedule(){previous=0;if(raf)cancelAnimationFrame(raf);raf=canRun()?requestAnimationFrame(tick):0;}
function buttons(){document.querySelectorAll('.toggle-play').forEach(b=>{b.setAttribute('aria-label',playing?'Pause animation':'Play animation');b.querySelector('.symbol').innerHTML=playing?'<rect x="5" y="4" width="3.5" height="12" rx=".5"/><rect x="11.5" y="4" width="3.5" height="12" rx=".5"/>':'<path d="M6 3.5v13l10-6.5z"/>';const s=b.querySelector('.label');if(s)s.textContent=playing?'Pause':'Play';});document.querySelectorAll('.expand-label').forEach(b=>b.textContent=expanded?'Close':'Enlarge');}
function play(){playing=true;buttons();schedule();}function pause(){playing=false;buttons();schedule();}function replay(){time=0;render();play();}function toggle(){playing?pause():play();}
function seek(v,pauseAfter=false){v=Number(v);if(!Number.isFinite(v))return;time=clamp(v,0,duration-.001);previous=0;if(pauseAfter)pause();render();}
function setSpeed(v){v=Number(v);if(!Number.isFinite(v)||v<=0)return;speed=clamp(v,.1,4);previous=0;const s=$('speed');if([...s.options].some(o=>Number(o.value)===speed))s.value=String(speed);}
function post(type,extra={}){if(parented)window.parent.postMessage({channel,type,...extra},parentOrigin);}
function setExpanded(v){expanded=!!v;document.documentElement.classList.toggle('expanded',expanded);buttons();if(expanded){visible=true;$('pause').focus({preventScroll:true});schedule();}}
async function enlarge(){if(parented){post('toggle-expand');return;}if(document.fullscreenElement){try{await document.exitFullscreen();}catch{}return;}if(viewer.classList.contains('local-expanded')){viewer.classList.remove('local-expanded');setExpanded(false);return;}try{if(!viewer.requestFullscreen)throw new Error();await viewer.requestFullscreen();}catch{viewer.classList.add('local-expanded');setExpanded(true);}}
for(const b of document.querySelectorAll('.toggle-play'))b.addEventListener('click',toggle);
for(const b of document.querySelectorAll('.replay'))b.addEventListener('click',replay);
for(const b of document.querySelectorAll('.enlarge'))b.addEventListener('click',enlarge);
slider.addEventListener('input',()=>seek(slider.value));$('speed').addEventListener('change',e=>setSpeed(e.target.value));
root.addEventListener('click',()=>{if(embedded&&!expanded)enlarge();});
document.addEventListener('fullscreenchange',()=>setExpanded(!!document.fullscreenElement));document.addEventListener('visibilitychange',schedule);
document.addEventListener('keydown',e=>{
 if(expanded&&e.key==='Tab'){const cs=[...document.querySelectorAll('.controls button,.controls input,.controls select')],first=cs[0],last=cs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
 if(e.key==='Escape'&&expanded){if(parented)post('close-expand');else if(viewer.classList.contains('local-expanded')){viewer.classList.remove('local-expanded');setExpanded(false);}return;}
 if(e.target.closest('input,select,button,a,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key.toLowerCase()==='r')replay();else if(e.key.toLowerCase()==='f')enlarge();else if(e.key==='ArrowLeft'){e.preventDefault();seek(time-.5);}else if(e.key==='ArrowRight'){e.preventDefault();seek(time+.5);}else if(e.key==='Home'){e.preventDefault();seek(0);}
});
window.addEventListener('message',e=>{if(!parented||e.source!==window.parent||(location.protocol!=='file:'&&location.origin!=='null'&&e.origin!==location.origin))return;const m=e.data;if(!m||m.channel!==channel)return;if(m.type==='visibility'){visible=!!m.visible;schedule();}else if(m.type==='expanded')setExpanded(m.expanded);else if(m.type==='restart')replay();else if(m.type==='seek')seek(m.time,true);});
window.PATACON_ANIMATION=Object.freeze({play,pause,replay,seek,setSpeed,duration,get state(){return{time,playing,speed,visible,expanded};}});
buttons();render();schedule();post('ready');

</script>
